<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTML on GitHub and Vercel</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --ink: #172033;
        --muted: #5d697d;
        --line: #dbe2ec;
        --accent: #0f8b8d;
        --accent-dark: #0b686a;
        --surface: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 15% 20%, rgba(15, 139, 141, 0.16), transparent 28rem),
          linear-gradient(135deg, #f6f8fb 0%, #edf3f7 45%, #fbfcfe 100%);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(92vw, 820px);
        padding: clamp(32px, 7vw, 72px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 24px 80px rgba(23, 32, 51, 0.12);
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0;
        max-width: 12ch;
        font-size: clamp(42px, 8vw, 82px);
        line-height: 0.95;
        font-weight: 760;
      }

      p {
        margin: 24px 0 0;
        max-width: 58ch;
        color: var(--muted);
        font-size: clamp(17px, 2vw, 20px);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 6px;
        color: #ffffff;
        background: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        background: var(--accent-dark);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 28px;
        padding-top: 26px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
      }

      .meta span {
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
      }

      @media (max-width: 560px) {
        body {
          place-items: stretch;
        }

        main {
          min-height: 100vh;
          width: 100%;
          border: 0;
          border-radius: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, Vercel.</h1>
      <p>
        This is a single-file HTML project created on the desktop, committed to GitHub, and
        deployed with Vercel.
      </p>
      <div class="actions">
        <a href="https://vercel.com" target="_blank" rel="noreferrer">Visit Vercel</a>
      </div>
      <div class="meta" aria-label="Project details">
        <span>One HTML file</span>
        <span>GitHub backed</span>
        <span>Static deployment</span>
      </div>
    </main>
  </body>
</html>
