<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Supabase Todo List</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316745f'/%3E%3Cpath d='M9 16.5l4.2 4.2L23.5 10.5' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7f5;
        --ink: #17201b;
        --muted: #66746c;
        --line: #d7e0da;
        --surface: #ffffff;
        --accent: #16745f;
        --accent-dark: #105747;
        --danger: #bc4035;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          radial-gradient(circle at 18% 12%, rgba(22, 116, 95, 0.14), transparent 30rem),
          linear-gradient(145deg, #f4f7f5 0%, #eaf1ed 54%, #f9fbfa 100%);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(24px, 5vw, 42px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 70px rgba(23, 32, 27, 0.12);
        backdrop-filter: blur(18px);
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0;
        font-size: clamp(38px, 8vw, 68px);
        line-height: 0.95;
        font-weight: 780;
      }

      .count {
        min-width: 88px;
        color: var(--muted);
        font-size: 14px;
        text-align: right;
      }

      form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        margin-bottom: 18px;
      }

      input {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 14px;
        color: var(--ink);
        background: #fbfcfb;
        font: inherit;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(22, 116, 95, 0.14);
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        padding: 0 16px;
        color: #ffffff;
        background: var(--accent);
        font: inherit;
        font-weight: 720;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.58;
      }

      .status {
        min-height: 22px;
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 14px;
      }

      .status.error {
        color: var(--danger);
      }

      ul {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
        min-height: 54px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .toggle {
        width: 24px;
        height: 24px;
        min-height: 24px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid #b8c6bf;
        border-radius: 999px;
        color: #ffffff;
        background: #ffffff;
      }

      .toggle[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent);
      }

      .title {
        min-width: 0;
        overflow-wrap: anywhere;
        font-size: 16px;
      }

      .completed .title {
        color: var(--muted);
        text-decoration: line-through;
      }

      .delete {
        width: 36px;
        min-height: 36px;
        padding: 0;
        color: var(--muted);
        background: transparent;
        font-size: 22px;
        line-height: 1;
      }

      .delete:hover {
        color: var(--danger);
        background: #fff2f0;
      }

      .empty {
        padding: 28px 14px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 18px;
        color: var(--muted);
        font-size: 13px;
      }

      .clear {
        min-height: 36px;
        color: var(--accent);
        background: transparent;
        font-size: 13px;
      }

      .clear:hover {
        background: rgba(22, 116, 95, 0.09);
      }

      @media (max-width: 560px) {
        body {
          align-items: stretch;
          padding: 0;
        }

        main {
          min-height: 100vh;
          width: 100%;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }

        header,
        footer {
          align-items: flex-start;
          flex-direction: column;
        }

        .count {
          min-width: 0;
          text-align: left;
        }

        form {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Todo List</h1>
        <div class="count" id="count">Loading</div>
      </header>

      <form id="todo-form">
        <input id="todo-input" type="text" maxlength="200" placeholder="Add a task" autocomplete="off" />
        <button id="add-button" type="submit">Add</button>
      </form>

      <p class="status" id="status" role="status">Connecting to Supabase...</p>
      <ul id="todo-list" aria-label="Todo items"></ul>

      <footer>
        <span>Backed by Supabase</span>
        <button class="clear" id="clear-completed" type="button">Clear completed</button>
      </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://luixvpsxnmfuptwncnvl.supabase.co";
      const SUPABASE_KEY = "sb_publishable_8BIgn9EqGAY5sgQP9Il-xQ_WXyV_dNL";
      const CLIENT_ID_KEY = "minimal-todo-client-id";

      const form = document.querySelector("#todo-form");
      const input = document.querySelector("#todo-input");
      const addButton = document.querySelector("#add-button");
      const list = document.querySelector("#todo-list");
      const statusEl = document.querySelector("#status");
      const countEl = document.querySelector("#count");
      const clearButton = document.querySelector("#clear-completed");

      const clientId = getClientId();
      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        global: {
          headers: {
            "x-client-id": clientId,
          },
        },
      });

      let todos = [];
      let busy = false;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const title = input.value.trim();
        if (!title || busy) return;

        await runTask(async () => {
          const { data, error } = await db
            .from("todos")
            .insert({ title, client_id: clientId })
            .select("id,title,completed,created_at")
            .single();

          if (error) throw error;
          todos = [...todos, data];
          input.value = "";
          render();
          setStatus("Saved");
        });
      });

      clearButton.addEventListener("click", async () => {
        if (busy || !todos.some((todo) => todo.completed)) return;

        await runTask(async () => {
          const { error } = await db
            .from("todos")
            .delete()
            .eq("client_id", clientId)
            .eq("completed", true);

          if (error) throw error;
          todos = todos.filter((todo) => !todo.completed);
          render();
          setStatus("Completed tasks cleared");
        });
      });

      loadTodos();

      async function loadTodos() {
        await runTask(async () => {
          const { data, error } = await db
            .from("todos")
            .select("id,title,completed,created_at")
            .order("created_at", { ascending: true });

          if (error) throw error;
          todos = data || [];
          render();
          setStatus("Ready");
        });
      }

      async function toggleTodo(todo) {
        await runTask(async () => {
          const { data, error } = await db
            .from("todos")
            .update({
              completed: !todo.completed,
              updated_at: new Date().toISOString(),
            })
            .eq("id", todo.id)
            .select("id,title,completed,created_at")
            .single();

          if (error) throw error;
          todos = todos.map((item) => (item.id === todo.id ? data : item));
          render();
          setStatus(data.completed ? "Marked complete" : "Marked active");
        });
      }

      async function deleteTodo(todo) {
        await runTask(async () => {
          const { error } = await db.from("todos").delete().eq("id", todo.id);

          if (error) throw error;
          todos = todos.filter((item) => item.id !== todo.id);
          render();
          setStatus("Deleted");
        });
      }

      async function runTask(task) {
        setBusy(true);
        try {
          await task();
        } catch (error) {
          console.error(error);
          setStatus(error.message || "Something went wrong", true);
        } finally {
          setBusy(false);
        }
      }

      function render() {
        list.innerHTML = "";
        const activeCount = todos.filter((todo) => !todo.completed).length;
        countEl.textContent = `${activeCount} active`;
        clearButton.disabled = !todos.some((todo) => todo.completed);

        if (!todos.length) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "No tasks yet";
          list.append(empty);
          return;
        }

        todos.forEach((todo) => {
          const item = document.createElement("li");
          item.className = todo.completed ? "completed" : "";

          const toggle = document.createElement("button");
          toggle.className = "toggle";
          toggle.type = "button";
          toggle.setAttribute("aria-label", todo.completed ? "Mark active" : "Mark complete");
          toggle.setAttribute("aria-pressed", String(todo.completed));
          toggle.textContent = todo.completed ? "✓" : "";
          toggle.addEventListener("click", () => toggleTodo(todo));

          const title = document.createElement("span");
          title.className = "title";
          title.textContent = todo.title;

          const remove = document.createElement("button");
          remove.className = "delete";
          remove.type = "button";
          remove.setAttribute("aria-label", `Delete ${todo.title}`);
          remove.textContent = "×";
          remove.addEventListener("click", () => deleteTodo(todo));

          item.append(toggle, title, remove);
          list.append(item);
        });
      }

      function setBusy(nextBusy) {
        busy = nextBusy;
        addButton.disabled = nextBusy;
        input.disabled = nextBusy;
      }

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
      }

      function getClientId() {
        const existing = localStorage.getItem(CLIENT_ID_KEY);
        if (existing) return existing;

        const id =
          typeof crypto.randomUUID === "function"
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        localStorage.setItem(CLIENT_ID_KEY, id);
        return id;
      }
    </script>
  </body>
</html>
